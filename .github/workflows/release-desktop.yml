# 发布桌面应用（项目基线 · 桌面应用）：Actions →「发布」→ Run workflow，选 patch / minor / major。
# 门禁（08–23 点、main 的 CI 全绿）→ 打 tag desktop-vX.Y.Z → macOS 构建 dmg（Developer ID 签名、公证）→ 安装包与版本清单上传对象存储 → GitHub Release 存档。
# 已安装的客户端读版本清单，提示新版本。流水线本体在 imelonkid/melon-ci（desktop-release，manifest: oss）。
name: 发布
run-name: "发布 · ${{ inputs.bump }}${{ inputs.emergency && ' · 紧急变更' || '' }}"
concurrency:
  group: ${{ github.repository }}-desktop-release
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 版本号怎么升
        type: choice
        options: [patch, minor, major]
        default: patch
      emergency:
        description: 紧急变更（允许 08–23 点之外发布，24 小时内补复盘）
        type: boolean
        default: false
jobs:
  release:
    permissions: { contents: write, checks: read }   # 打 tag、查 CI、建 Release
    uses: imelonkid/melon-ci/.github/workflows/desktop-release.yml@v2
    with:
      tag-prefix: desktop-v                           # 各端独立 tag（鸿蒙端以后用 harmony-v）
      manifest: oss                                   # 没有服务端：版本清单也放对象存储
      bump: ${{ inputs.bump }}
      emergency: ${{ inputs.emergency }}
      runner: macos-15                                # 原生 Swift：要 Swift 6 工具链（Package.swift 的 swift-tools-version 6.0）
      sign: true                                      # Developer ID 签名 + 公证；证书、描述文件、公证密钥在 production 环境（README「GitHub production 环境」）
    secrets: inherit
