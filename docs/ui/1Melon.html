<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1Melon 设计稿</title>
<!--
  1Melon macOS 桌面端设计稿（暖白）。SwiftUI 实现按这份稿来，颜色取下面 :root 里的变量，浅色 / 深色各一套。
  原则：只有一个强调色（橙）；其余都是中性灰。条目图标、保险库图标、标签都不用彩色。
  演示数据全是虚构的。不加载任何远程资源（图标是内联 SVG）。
-->
<style>
*{box-sizing:border-box}
html,body{margin:0}
:root{--mono:"SF Mono",ui-monospace,Menlo,monospace;--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB",sans-serif}

/* ===== 浅色：暖白 ===== */
[data-t=light]{
 --desk:#e9e6e2;
 --side:#f7f6f4;        /* 侧栏 */
 --list:#fcfbfa;        /* 条目列表 */
 --bg:#ffffff;          /* 详情、窗口 */
 --card:#ffffff;        /* 字段卡片 */
 --input:#f6f4f2;       /* 搜索框、输入框 */
 --tile:#f1efec;        /* 条目 / 保险库图标底 */
 --tile-fg:#57524e;     /* 条目 / 保险库图标 */
 --text:#1f1d1b;--text2:#6f6a66;--text3:#a7a19c;
 --line:rgba(40,25,10,.08);--line2:rgba(40,25,10,.14);--hover:rgba(40,25,10,.045);
 --accent:#f26a1b;      /* 唯一的强调色 */
 --accent-soft:#fff1e6; /* 选中底色 */
 --accent-text:#e2560a; /* 浅底上的强调文字 */
 --danger:#d9443b;      /* 只用于错误和删除 */
 --shadow:0 30px 80px rgba(60,30,10,.18),0 0 0 .5px rgba(60,30,10,.16);
 --accent-shadow:0 6px 14px rgba(242,106,27,.30);
 --illus:#f3f1ee;--illus2:#e2ddd8;
}
/* ===== 深色：纯黑 ===== */
[data-t=dark]{
 --desk:#1a1a1a;
 --side:#111111;
 --list:#0a0a0a;
 --bg:#000000;
 --card:#141414;
 --input:#161616;
 --tile:#1f1f1f;
 --tile-fg:#d6d6d6;
 --text:#f5f5f5;--text2:#a3a3a3;--text3:#666666;
 --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.13);--hover:rgba(255,255,255,.06);
 --accent:#ff7a2b;
 --accent-soft:rgba(255,122,43,.16);
 --accent-text:#ff9a5c;
 --danger:#f07a70;
 --shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 .5px rgba(255,255,255,.14);
 --accent-shadow:0 6px 16px rgba(255,122,43,.28);
 --illus:#161616;--illus2:#2c2c2c;
}

#root{min-height:100vh;background:var(--desk);color:var(--text);font-family:var(--sys);font-size:13px;-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:18px;align-items:center;padding:12px 24px;background:color-mix(in srgb,var(--desk) 88%,transparent);backdrop-filter:blur(12px);border-bottom:.5px solid var(--line)}
.bar h1{font-size:15px;margin:0}
.bar .hint{color:var(--text2)}
.seg{display:flex;background:var(--hover);border-radius:9px;padding:2px;margin-left:auto}
.seg button{border:0;background:transparent;font:inherit;color:var(--text2);padding:5px 14px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.screen{padding:28px 24px 8px;overflow-x:auto}
.screen h2{max-width:1200px;margin:0 auto 4px;font-size:14px}
.screen p.d{max-width:1200px;margin:0 auto 14px;color:var(--text2);line-height:1.6}
.win{position:relative;width:1200px;height:760px;margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:var(--bg);display:flex;color:var(--text)}
.win.small{width:680px;height:auto;min-height:520px;flex-direction:column}
.lights{position:absolute;top:18px;left:20px;display:flex;gap:8px;z-index:3}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ===== 侧栏 ===== */
.side{width:248px;flex-shrink:0;background:var(--side);border-right:.5px solid var(--line);display:flex;flex-direction:column;padding:56px 14px 0}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 20px}
.logo{width:44px;height:44px;border-radius:13px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--accent-shadow)}
.logo svg.i{width:24px;height:24px;stroke-width:2}
.brand b{display:block;font-size:17px}
.brand span{font-size:12px;color:var(--text2)}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:11px;font-size:14px;margin-bottom:2px;color:var(--text)}
.nav>svg.i{color:var(--text2)}
.nav .n{margin-left:auto;font-size:12.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.nav .chev{color:var(--text3);margin-left:auto}
.nav .n+.chev{margin-left:6px}
.nav.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav.on>svg.i{color:var(--accent-text)}
.nav.on .n{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-text);border-radius:10px;padding:1px 8px}
.nav .n.hot{color:var(--accent-text);font-weight:600}
.sbh{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text2);padding:18px 12px 6px}
.vt{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--tile);color:var(--tile-fg)}
.vt svg.i{width:13px;height:13px;stroke-width:2}
.sbfoot{margin-top:auto;border-top:.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 12px 14px;color:var(--text2)}
.sbfoot .l{display:flex;align-items:center;gap:6px;font-size:12.5px}
.sbfoot .r{display:flex;gap:14px}

/* ===== 条目列表 ===== */
.list{width:340px;flex-shrink:0;background:var(--list);border-right:.5px solid var(--line);display:flex;flex-direction:column}
.lhead{padding:42px 18px 10px}
.srow{display:flex;gap:10px}
.search{flex:1;height:40px;border-radius:12px;background:var(--input);border:.5px solid var(--line2);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--text3);font-size:13.5px}
.plus{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--accent-shadow)}
.plus svg.i{width:20px;height:20px;stroke-width:2.2}
.frow{display:flex;justify-content:space-between;margin-top:14px;color:var(--text2);font-size:12.5px}
.frow span{display:flex;align-items:center;gap:5px}
.frow svg.i{width:14px;height:14px}
.items{flex:1;overflow:hidden;padding:4px 10px;border-top:.5px solid var(--line)}
.grp{font-size:11.5px;color:var(--text3);padding:12px 10px 6px;font-weight:600}
.it{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;margin-bottom:2px}
.it.on{background:var(--accent-soft)}
.tile{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--tile);color:var(--tile-fg);font-weight:600;font-size:15px;flex-shrink:0}
.tile svg.i{width:18px;height:18px}
.it .t{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .star{margin-left:auto;color:var(--accent)}
.it .star svg.i{width:14px;height:14px;fill:currentColor}

/* ===== 详情 ===== */
.detail{flex:1;background:var(--bg);display:flex;flex-direction:column;min-width:0}
.dtool{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:16px 20px 0;height:48px}
.btn{height:32px;padding:0 14px;border-radius:9px;border:.5px solid var(--line2);background:var(--card);display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text)}
.btn.pri{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
.btn.icon{border:0;background:transparent;color:var(--text2);padding:0 8px}
.btn svg.i{width:15px;height:15px}
.dbody{padding:8px 40px 30px;overflow:hidden}
.hero{display:flex;gap:16px;align-items:center;padding:10px 0 22px}
.hero .tile{width:60px;height:60px;border-radius:16px;font-size:24px}
.hero .tile svg.i{width:28px;height:28px}
.hero h3{margin:0;font-size:24px;color:var(--text)}
.hero .m{color:var(--text2);margin-top:6px;display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;background:var(--hover);font-size:12px;color:var(--text2)}
.sech{font-size:12px;color:var(--text3);font-weight:600;padding:16px 2px 8px}
.fields{border-radius:14px;border:.5px solid var(--line2);background:var(--card)}
.f{display:flex;align-items:center;padding:12px 16px;border-top:.5px solid var(--line);gap:12px;min-height:50px}
.f:first-child{border-top:0}
.f .k{width:96px;flex-shrink:0;color:var(--text2)}
.f .v{flex:1;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.f .v.mono{font-family:var(--mono);font-size:14px;letter-spacing:.3px}
.f .acts{display:flex;gap:2px;color:var(--text3)}
.f .acts span{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.f .acts span.hot{background:var(--accent-soft);color:var(--accent-text)}
.f .acts svg.i{width:15px;height:15px}
.f a{color:var(--accent-text);text-decoration:none}
.dg{color:var(--accent-text)}  /* 密码里的数字 */
.sy{color:var(--text2);font-weight:600}  /* 密码里的符号 */
.totp{display:flex;align-items:center;gap:10px}
.totp b{font-family:var(--mono);font-size:19px;letter-spacing:2px;color:var(--accent-text)}
.meter{display:flex;gap:3px;vertical-align:middle}
.meter i{width:16px;height:4px;border-radius:2px;background:var(--accent);display:inline-block}
.meter i.off{background:var(--line2)}
.tags{display:flex;gap:6px}
.dfoot{color:var(--text3);font-size:12px;margin-top:18px}

/* 编辑 */
.inp{flex:1;height:34px;border-radius:9px;background:var(--input);border:.5px solid var(--line2);display:flex;align-items:center;padding:0 10px;font-size:14px;color:var(--text);min-width:0}
.inp.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.ph{color:var(--text3)}
.inp.big{height:40px;font-size:20px;font-weight:600;flex:1}
.link{display:flex;align-items:center;gap:6px;color:var(--accent-text);padding:12px 2px}
.link svg.i{width:15px;height:15px}

/* 空状态 */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.empty h4{margin:18px 0 6px;font-size:17px;color:var(--text)}
.empty p{margin:0;color:var(--text2);line-height:1.6}
.kbd{display:inline-flex;width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text);align-items:center;justify-content:center;vertical-align:middle;margin:0 3px}
.kbd svg.i{width:12px;height:12px;stroke-width:2.6}

/* 解锁 / 首次启动 */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.center .logo{width:80px;height:80px;border-radius:22px}
.center .logo svg.i{width:40px;height:40px}
.center h3{margin:20px 0 4px;font-size:22px;color:var(--text)}
.center .sub{color:var(--text2)}
.pw{margin-top:28px;width:320px;height:44px;border-radius:13px;background:var(--card);border:.5px solid var(--line2);display:flex;align-items:center;padding:0 5px 0 14px;color:var(--text3);font-size:14px}
.pw .go{margin-left:auto;width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.touch{margin-top:6px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent-text);background:var(--accent-soft)}
.touch svg.i{width:28px;height:28px;stroke-width:1.4}
.choices{margin-top:30px;width:420px;border-radius:14px;border:.5px solid var(--line2);background:var(--card)}
.choice{display:flex;align-items:center;gap:14px;padding:16px 18px;border-top:.5px solid var(--line)}
.choice:first-child{border-top:0}
.choice b{display:block;font-size:14.5px;color:var(--text)}
.choice span.s{color:var(--text2);font-size:12.5px}
.choice .chev{margin-left:auto;color:var(--text3)}
.form{margin-top:26px;width:340px;display:flex;flex-direction:column;gap:10px}
.form .inp{flex:none;height:40px;border-radius:11px}
.form textarea{height:92px}
.check{display:flex;gap:8px;align-items:flex-start;color:var(--text2);font-size:12.5px;line-height:1.5;margin-top:4px}
.check i{width:16px;height:16px;border-radius:5px;background:var(--accent);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff}
.check i svg.i{width:11px;height:11px;stroke-width:3}
.cta{margin-top:8px;height:42px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:var(--accent-shadow)}
.back{position:absolute;top:52px;left:24px;display:flex;align-items:center;gap:4px;color:var(--text2)}

/* 设置窗口 */
.stitle{height:52px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--text)}
.tabs{display:flex;justify-content:center;gap:4px;padding:0 0 12px;border-bottom:.5px solid var(--line)}
.tab{width:72px;padding:6px 0;border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text2);font-size:11.5px}
.tab svg.i{width:20px;height:20px}
.tab.on{background:var(--hover);color:var(--text)}
.sbody{background:var(--side);padding:8px 28px 28px;flex:1}
.sbody .sech{padding-left:4px}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:46px;border-top:.5px solid var(--line);color:var(--text)}
.row:first-child{border-top:0}
.row .r{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--text2)}
.row .muted{color:var(--text2);font-size:12px}
.sw{width:34px;height:20px;border-radius:10px;background:var(--accent);position:relative}
.sw:after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.off{background:var(--line2)}
.sw.off:after{right:auto;left:2px}
.sel{display:flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:7px;border:.5px solid var(--line2);background:var(--card);color:var(--text);font-size:12.5px}
.sel svg.i{width:12px;height:12px}
.sbtn{height:26px;padding:0 10px;border-radius:7px;border:.5px solid var(--line2);background:var(--card);display:flex;align-items:center;font-size:12.5px;color:var(--text)}
.sbtn.danger{color:var(--danger)}
.ok{display:inline-flex;align-items:center;gap:6px}
.ok i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pair{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}

/* 新建条目选择 */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;z-index:4}
[data-t=dark] .overlay{background:rgba(0,0,0,.6)}
.picker{width:520px;border-radius:16px;background:var(--bg);border:.5px solid var(--line2);box-shadow:var(--shadow);padding:18px}
.picker h4{margin:0 0 14px;font-size:15px;color:var(--text)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgrid div{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;color:var(--text)}
.pgrid div.on{background:var(--accent-soft);color:var(--accent-text)}
.pgrid .tile{width:32px;height:32px;border-radius:9px}
</style>
</head>
<body>
<div id="root" data-t="light">
 <div class="bar"><h1>1Melon 设计稿</h1><span class="hint">暖白 · 演示数据全是假的</span><div class="seg" id="seg"></div></div>
 <div id="screens"></div>
</div>
<script>
const P={
 grid:'<rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/>',
 star:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
 shield:'<path d="M12 3l7 3v5.5c0 4.3-3 7.9-7 9.5-4-1.6-7-5.2-7-9.5V6z"/><path d="M9 12l2 2 4-4"/>',

 home:'<path d="M4 11l8-7 8 7v8.5a1 1 0 0 1-1 1h-4.5V15h-5v5.5H5a1 1 0 0 1-1-1z"/>',

 lock:'<rect x="5" y="11" width="14" height="9.5" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 filter:'<path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"/>',
 sort:'<path d="M8 4v16M4.5 7.5L8 4l3.5 3.5M16 20V4M12.5 16.5L16 20l3.5-3.5"/>',
 down:'<path d="M6 9l6 6 6-6"/>',
 right:'<path d="M9 6l6 6-6 6"/>',
 left:'<path d="M15 6l-6 6 6 6"/>',
 copy:'<rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/>',
 eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
 edit:'<path d="M14.5 5.5l4 4L8 20H4v-4z"/>',
 more:'<circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/>',
 card:'<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/>',
 note:'<path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 16h4"/>',
 wifi:'<path d="M3 9.5a13 13 0 0 1 18 0M6 13a8.5 8.5 0 0 1 12 0M9 16.5a4 4 0 0 1 6 0"/><circle cx="12" cy="19.5" r=".6"/>',

 else body=`

 document.getElementById('screens').innerHTML=SCREENS.map(([t,d,fn])=>`<section class="screen"><h2>${t}</h2>${d?`<p class="d">${d}</p>`:'<p class="d"></p>'}${fn()}</section>`).join('')+'<div style="height:40px"></div>';
}
